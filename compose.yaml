services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: nutrimaxlent
      POSTGRES_USER: nutrimaxlent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutrimaxlent-local}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'nutrimaxlent', '-d', 'nutrimaxlent']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
